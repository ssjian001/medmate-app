name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable
          cache: true

      - name: Restore signing keystore (与本地构建同源)
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Stamp signing cert
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort | tail -1)
          $APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk > signing-cert.txt

      - name: Rename APK with tag
        if: startsWith(github.ref, 'refs/tags/')
        run: cp build/app/outputs/flutter-apk/app-release.apk "App_${{ github.ref_name }}.apk"

      - name: Upload build artifact (手动触发时)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            signing-cert.txt

      - name: Create Release (打 tag 时)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            App_${{ github.ref_name }}.apk
            signing-cert.txt
          generate_release_notes: true
